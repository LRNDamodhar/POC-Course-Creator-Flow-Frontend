<div class="chat-page-container">
  <div class="header">
    <div class="header-content">
      <h1>AI Course Creator Chat</h1>
      <div class="user-info">
        <!-- New Chat -->
        <button class="header-icon-btn" (click)="newChat()" title="New Chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>

        <!-- History -->
        <button class="header-icon-btn" (click)="toggleHistory()" title="Session History">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 019-9 9.75 9.75 0 016.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M3 12a9 9 0 009 9 9.75 9.75 0 006.74-2.74L21 16"/>
          </svg>
        </button>

        <!-- Logout -->
        <button class="header-icon-btn" (click)="logout()" title="Logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="main-content">

    <!-- Floating sticky-note preview toggle — hidden when panel is open -->
    @if (!showPreview()) {
      <button
        class="preview-sticky-btn"
        (click)="togglePreview()"
        title="Show Preview">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span>Preview</span>
      </button>
    }

    <!-- Left Side: Chat Input and List -->
    <div class="left-panel">

      <div class="chat-list-section">
        <app-chat-list
          [showHistoryFromParent]="showHistory()"
          [showPreview]="showPreview()"
          (previewToggle)="togglePreview()">
        </app-chat-list>
      </div>
      
      <div class="chat-input-section">
        <app-chat-input></app-chat-input>
      </div>
    </div>

    <!-- Right Side: Preview (hidden by default, toggled via header button) -->
    @if (showPreview()) {
      <div class="right-panel">
        <app-chat-preview (collapse)="togglePreview()"></app-chat-preview>
      </div>
    }
  </div>
</div>
